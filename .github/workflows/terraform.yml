# Pipeline Terraform avec approbation manuelle :
#   1. plan       -> terraform plan, sauvegardé dans HCP Terraform
#   2. validation -> le job "apply" attend l'approbation d'un réviseur
#                    (environnement GitHub "production")
#   3. apply      -> applique exactement le plan qui a été validé

name: Terraform - plan, validation, apply

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un seul déploiement à la fois : un nouveau run attend la fin du précédent
concurrency:
  group: terraform-deploy
  cancel-in-progress: false

jobs:
  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4" # même version que le workspace HCP Terraform
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Afficher le plan dans le résumé du run (pour le réviseur)
        run: |
          {
            echo '### Plan Terraform à valider'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Conserver le plan pour le job apply
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

  apply:
    name: terraform apply (après validation)
    needs: plan
    runs-on: ubuntu-latest
    # Le job s'arrête ici tant qu'un réviseur de l'environnement
    # "production" n'a pas approuvé le déploiement.
    environment: production
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false

      - name: Récupérer le plan validé
        uses: actions/download-artifact@v8
        with:
          name: tfplan

      - name: terraform apply
        run: terraform apply -input=false -no-color tfplan
